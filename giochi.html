<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cbc8bb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Giochi – Pocket Dot</title>
<style>
:root{--bg:#e4e1d8;--ink:#2b2d33;--mut:#6b6d73;--card:#f3f0e7;--line:#c9c5b8;--acc:#a3204f}
@media (prefers-color-scheme:dark){:root{--bg:#17191c;--ink:#e6e3da;--mut:#9a9ca2;--card:#23262a;--line:#34383d;--acc:#e0577f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
.back{display:inline-block;color:var(--ink);text-decoration:none;font-weight:600;margin-bottom:14px}
h1{margin:0 0 4px;font:italic 800 1.7rem/1.1 "Trebuchet MS",system-ui,sans-serif;color:var(--acc)}
.sub{margin:0 0 20px;color:var(--mut);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pic{display:block;aspect-ratio:1;background:var(--line);position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.pic:hover img{transform:scale(1.04)}
.ph{width:100%;height:100%;display:grid;place-items:center;font:italic 800 3rem/1 "Trebuchet MS",system-ui,sans-serif;color:var(--acc)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.t{font-weight:700;line-height:1.25}.n{color:var(--mut);font-size:.8rem;line-height:1.3}
.go{margin-top:auto;padding-top:8px}
.go a{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:.9rem;padding:.55em 0;border-radius:8px;background:var(--acc);color:#fff}
.go a:hover{filter:brightness(1.1)}
a:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
.vuoto{color:var(--mut)}
</style></head><body>
<main>
<a class="back" href="index.html">← Torna al Game Boy</a>
<h1>Giochi</h1>
<p class="sub">Tocca una copertina o il bottone Gioca: il gioco si apre sul Game Boy.</p>
<ul id="lista"></ul>
</main>
<script src="giochi.js"></script>
<script>
const ul=document.getElementById("lista");
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
if(!GIOCHI.length){ul.replaceWith(mk("p","vuoto","Nessun gioco in elenco. Aggiungili in giochi.js."))}
for(const g of GIOCHI){
  const url="index.html?rom="+encodeURIComponent(g.file);
  const li=mk("li","card"),pic=mk("a","pic");
  pic.href=url;pic.setAttribute("aria-label","Gioca a "+g.titolo);
  const ph=mk("div","ph",(g.titolo||"?").trim().charAt(0).toUpperCase());
  if(g.img){const im=new Image();im.alt="";im.loading="lazy";im.src="covers/"+encodeURIComponent(g.img);
    im.addEventListener("error",()=>im.replaceWith(ph));pic.append(im)}else pic.append(ph);
  const info=mk("div","info");info.append(mk("div","t",g.titolo));
  if(g.nota)info.append(mk("div","n",g.nota));
  const go=mk("div","go"),b=mk("a","","▶ Gioca");b.href=url;go.append(b);info.append(go);
  li.append(pic,info);ul.append(li);
}
</script></body></html>
